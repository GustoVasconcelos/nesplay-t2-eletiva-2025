<svg width="60" height="60" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo -->
  <rect width="50" height="50" fill="none" />

  <!-- Corpo do console NES -->
  <rect x="10" y="20" width="30" height="12" rx="2" ry="2" fill="#adb5bd" />
  <rect x="10" y="24" width="30" height="4" fill="#6c757d" /> <!-- faixa escura -->

  <!-- Slot de cartucho -->
  <rect x="20" y="20" width="10" height="2" fill="#343a40" />

  <!-- Detalhes (botões) -->
  <rect x="12" y="27" width="2" height="2" fill="#dc3545" />
  <rect x="16" y="27" width="2" height="2" fill="#dee2e6" />

  <!-- Detalhes (linhas da carcaça) -->
  <line x1="10" y1="30" x2="40" y2="30" stroke="#ced4da" stroke-width="1" />
</svg>
