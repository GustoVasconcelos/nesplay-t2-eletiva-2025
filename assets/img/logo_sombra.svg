<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="50" height="50" fill="#f8f9fa" />

  <!-- Controle NES base com sombra -->
  <rect x="9" y="18" width="32" height="14" rx="2" ry="2" fill="#6c757d" filter="url(#shadow)" />
  <rect x="11" y="20" width="28" height="10" fill="#343a40" />

  <!-- D-Pad -->
  <rect x="14" y="22" width="2" height="6" fill="#dee2e6" />
  <rect x="12" y="24" width="6" height="2" fill="#dee2e6" />

  <!-- Select & Start -->
  <rect x="22" y="24" width="2" height="2" fill="#adb5bd" />
  <rect x="26" y="24" width="2" height="2" fill="#adb5bd" />

  <!-- Botões A e B -->
  <circle cx="33" cy="25" r="2" fill="#dc3545" />
  <circle cx="37" cy="25" r="2" fill="#dc3545" />

  <!-- Moldura circular -->
  <circle cx="25" cy="25" r="24" stroke="#adb5bd" stroke-width="2" fill="none"/>
</svg>
