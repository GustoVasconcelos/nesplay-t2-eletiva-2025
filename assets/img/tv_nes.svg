<svg width="60" height="60" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo -->
  <rect width="50" height="50" fill="none" />

  <!-- Corpo da TV -->
  <rect x="10" y="12" width="30" height="22" rx="2" ry="2" fill="#adb5bd" />
  <rect x="12" y="14" width="26" height="18" fill="#343a40" /> <!-- Tela -->

  <!-- Botões da TV -->
  <circle cx="33" cy="33" r="1" fill="#dee2e6" />
  <circle cx="37" cy="33" r="1" fill="#dee2e6" />

  <!-- Pernas da TV -->
  <rect x="14" y="36" width="2" height="4" fill="#6c757d" />
  <rect x="34" y="36" width="2" height="4" fill="#6c757d" />

  <!-- Antenas -->
  <line x1="25" y1="12" x2="20" y2="4" stroke="#495057" stroke-width="1" />
  <line x1="25" y1="12" x2="30" y2="4" stroke="#495057" stroke-width="1" />
</svg>
