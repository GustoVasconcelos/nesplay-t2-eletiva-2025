<body>
    <header
        class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 border-bottom container">
        <div class="col-md-2 mb-2 mb-md-0 d-flex">
            <a href="/" class="nav-link d-inline-flex link-body-emphasis text-decoration-none">
                <img class="logotipo" src="../../assets/img/logo.svg" alt="">
                <h1 id="texto-logotipo" class="mb-md-0 px-2">
                    <span>N</span>
                    <span>E</span>
                    <span>S</span>
                    <span>P</span>
                    <span>l</span>
                    <span>a</span>
                    <span>y</span>
                </h1>
            </a>
        </div>
        <div class="col-md-2 text-end">
            <a class="btn btn-outline-secondary me-2" href="../login.html" role="button">Login</a>
            <a class="btn btn-secondary" href="../cadastrar.html" role="button">Cadastrar</a>
        </div>
    </header>
    <nav class="container px-2 border-bottom">
        <ul class="nav nav-underline col-12 col-md-auto mb-2 justify-content-center mb-md-0">
            <li><a href="../../index.html" class="nav-link px-2 link-body-emphasis">Home</a></li>
            <li><a href="#" class="nav-link px-2 link-body-emphasis">Gerenciar Usuários</a></li>
            <li><a href="#" class="nav-link px-2 link-body-emphasis">Gerenciar Categorias</a></li>
            <li><a href="#" class="nav-link px-2 link-body-emphasis">Gerenciar Comentários</a></li>
            <li><a href="#" class="nav-link px-2 link-body-emphasis">Gerenciar ROMs</a></li>
            <li><a href="#" class="nav-link px-2 link-body-emphasis">Sobre</a></li>
        </ul>
    </nav>
    <main class="container px-4 py-5">
        <h2 class="h3 mb-4 fw-normal text-center">Gerenciar Categorias</h2>
        <form class="form-outline w-50">
            <legend>Cadastrar Categoria</legend>
            <fieldset class="border rounded row py-3">
                <div class="row-12 d-flex px-3">
                    <input type="text" class="form-control me-3" id="nomeCategoria" placeholder="Categoria">
                    <button class="btn btn-secondary" type="submit">Cadastrar</button>
                </div>
            </fieldset>
        </form>
        <form class="form-outline w-50 py-3">
            <legend>Apagar Categoria</legend>
            <fieldset class="border rounded row py-3">
                <div class="row-12 d-flex px-3">
                    <select class="form-select me-3" id="inputGroupSelect01">
                        <option selected>Escolher...</option>
                        <option value="1">One</option>
                        <option value="2">Two</option>
                    </select>
                    <button class="btn btn-secondary" type="submit">Deletar</button>
                </div>
            </fieldset>
        </form>
    </main>
    </main>
    <footer class="py-3 my-3 container">
