<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/style.css">
    <link rel="icon" type="image/png" href="../assets/img/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon/favicon.svg" />
    <title>NESPlay - Login</title>
</head>
<body>
    <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom container">
        <div class="col-md-2 mb-2 mb-md-0 d-flex">
            <a href="/" class="nav-link d-inline-flex link-body-emphasis text-decoration-none">
                <img src="../assets/img/logo.svg" alt="">
                <h1 class="mb-md-0 px-2">NESPlay</h1>
            </a>
        </div>
        <ul class="nav nav-underline col-12 col-md-auto mb-2 justify-content-center mb-md-0">
            <li><a href="../index.html" class="nav-link px-2 link-body-emphasis">Home</a></li>
            <li><a href="#" class="nav-link px-2 link-body-emphasis">Sobre</a></li>
        </ul>
        <div class="col-md-2 text-end">
            <a class="btn btn-outline-secondary me-2" href="login.html" role="button">Login</a>
            <a class="btn btn-secondary" href="#" role="button">Cadastrar</a>
        </div>
    </header>
    <main class="container px-4 py-5 form-signin w-100 m-auto">
        <form>
            <h1 class="h3 mb-3 fw-normal text-center">Login</h1>
            <div class="form-floating">
                <input type="email" class="form-control" id="floatingInput" placeholder="nome@email.com"> <label for="floatingInput">Endereço de E-mail</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control" id="floatingPassword" placeholder="Senha"> <label for="floatingPassword">Senha</label>
            </div>
            <div class="form-check text-start my-3">
                <input class="form-check-input" type="checkbox" value="remember-me" id="checkDefault">
                <label class="form-check-label" for="checkDefault">Lembrar-me</label>
            </div>
            <button class="btn btn-secondary w-100 py-2" type="submit">Entrar</button>
        </form>
    </main>

    <footer class="py-3 my-4 container">
        <ul class="nav nav-underline justify-content-center border-bottom pb-3 mb-3">
            <li class="nav-item"><a href="#" class="nav-link px-2 link-body-emphasis">Dúvidas?</a></li>
            <li class="nav-item"><a href="#" class="nav-link px-2 link-body-emphasis">Privacidade</a></li>
            <li class="nav-item"><a href="#" class="nav-link px-2 link-body-emphasis">Termos</a></li>
        </ul>
        <p class="text-center text-body-secondary">© 2025 NESPlay</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
</html>
